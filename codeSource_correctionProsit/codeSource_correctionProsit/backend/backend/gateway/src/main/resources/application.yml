server:
  port: 9090

spring:
  application:
    name: gateway

  cloud:
    gateway:
      httpclient:
        connect-timeout: 5000
        response-timeout: 10s

# =========================================================================
# Mode de routage pour la classe GatewayConfig.java (Méthode 1 - Java) :
#   - dynamic : utilise Eureka & le Load Balancer (lb://...) [Recommandé, Partie 3]
#   - static  : utilise les ports fixes (http://localhost:...) [Partie 2]
# =========================================================================
gateway:
  routing:
    mode: dynamic

# =========================================================================
# Configuration Eureka Client (Partie 1 & 3)
# La Gateway s'enregistre auprès d'Eureka et récupère le registre
# =========================================================================
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  info:
    env:
      enabled: true

info:
  app:
    name: API Gateway
    description: Spring Cloud Gateway with Eureka
    port: 9090

# =========================================================================
# Visualisation du routage (Partie 3 - 2.a du Workshop)
# Affiche dans la console quelle instance Eureka et quel algorithme
# de Load Balancer est sélectionné pour chaque requête
# =========================================================================
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG

